# Polish: which tone to start in, based on where the text came from.
# Each line: <regex> = <tone>
# The regex (case-insensitive, extended) is matched against
# "<window class> <window title> <page url>"; the first match wins.
# Tones: proofread tweet casual punchy concise detailed formal witty
# A tone picked in Brave's right-click menu always wins over these rules.

# X / Twitter (Brave titles end in "/ X")
x\.com|twitter|/ X( |$)                 = tweet
# Chat apps: friendly
whatsapp|telegram|signal|discord|slack  = casual
# Email and professional networks
gmail|outlook|thunderbird|proton.?mail|mail\.  = formal
linkedin                                = formal
